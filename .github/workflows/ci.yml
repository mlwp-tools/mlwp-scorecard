name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fast tests
        run: uv run --all-extras pytest -m "not slow and not mpl"
      - name: Run full suite
        run: uv run --all-extras pytest
