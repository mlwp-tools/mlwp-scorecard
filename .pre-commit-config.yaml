# https://pre-commit.com/
# The ECMWF reference card is a captured artefact, and docs/images/ holds cards
# generated by docs/example/make_card.py: never reformat either, or they stop
# matching what produced them.
exclude: '^(scorecards-.*\.html|docs/images/.*)$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  # isort should run before black as black sometimes tweaks the isort output
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
  # https://github.com/python/black#version-control-integration
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
      - id: black-jupyter
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
  # Every module, class, function and method in the package has a numpydoc
  # docstring; which checks apply is set in pyproject.toml [tool.numpydoc_validation].
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      - id: numpydoc-validation
        files: ^src/
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
