[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlwp-scorecards"
dynamic = ["version"]
description = "Weather forecasting scorecards from pre-computed verification statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "xarray>=2024.1",
  "numpy>=1.26",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "loguru",
]

[tool.isort]
profile = "black"

[project.optional-dependencies]
static = [
  "matplotlib>=3.8,<4",
]
netcdf = [
  "netcdf4>=1.6",
  "h5netcdf>=1.3",
]
zarr = [
  "zarr>=3",
]
test = [
  "pytest>=8.0.0",
  "pytest-mpl>=0.17",
  "syrupy>=4",
  "hypothesis>=6.100",
  "matplotlib~=3.10.0",
  "netcdf4>=1.6",
  "zarr>=3",
  "s3fs",
  "arraylake",
  "scipy",
]

[project.scripts]
"mlwp.make_scorecard" = "mlwp_scorecards.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that build a full ECMWF-scale card (45x30x15)",
    "mpl: marks tests that require matplotlib and pytest-mpl baseline images",
    "golden: marks tests that compare against committed golden artefacts",
]

[tool.numpydoc_validation]
# Every module, class, function and method in src/ carries a numpydoc docstring,
# checked by the numpydoc-validation pre-commit hook. Left out:
#   GL01  the summary starts on the opening-quote line in this codebase
#   ES01  an extended summary on every object would be padding
#   SA01  likewise a See Also section
#   EX01  likewise an Examples section
checks = ["all", "GL01", "ES01", "SA01", "EX01"]
# A constructor's parameters are documented on its class, and checked there
# against the __init__ signature (the numpydoc convention).
exclude = ['\.__init__$']

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ipython>=9.11.0",
    "pytest>=9.0.2",
    "colorspacious>=1.1",
]
